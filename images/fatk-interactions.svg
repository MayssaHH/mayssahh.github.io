<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941"><rect width="1672" height="941" fill="#F7F7F5"/><style>.t{font-family:Georgia,'Times New Roman',serif;fill:#243B53}.m{font-family:Georgia,'Times New Roman',serif;fill:#74777A}.math{font-family:'Times New Roman',Georgia,serif;font-style:italic;fill:#243B53}</style><g stroke="#DDDCD8" fill="#F7F7F5"><rect x="28" y="156" width="522" height="627" rx="14"/><rect x="564" y="156" width="522" height="627" rx="14"/><rect x="1100" y="156" width="522" height="627" rx="14"/></g><g><circle cx="94" cy="207" r="34" fill="#243B53"/><text x="94" y="219" text-anchor="middle" font-family="Georgia" font-size="34" fill="#fff">1</text><text x="166" y="225" class="t" font-size="48" font-weight="700">Additive</text><text x="166" y="275" class="m" font-size="24">Each feature contributes independently</text><text x="166" y="307" class="m" font-size="24">to the prediction.</text><circle cx="106" cy="390" r="38" fill="#FAFAF8" stroke="#243B53" stroke-width="2"/><text x="106" y="402" text-anchor="middle" class="math" font-size="32">x₁</text><circle cx="106" cy="500" r="38" fill="#FAFAF8" stroke="#243B53" stroke-width="2"/><text x="106" y="512" text-anchor="middle" class="math" font-size="32">x₂</text><circle cx="268" cy="445" r="52" fill="#FAFAF8" stroke="#243B53" stroke-width="2"/><text x="268" y="462" text-anchor="middle" class="t" font-size="54">Σ</text><text x="350" y="460" class="math" font-size="31">f(x) = x₁ + x₂</text><rect x="48" y="590" width="482" height="170" rx="12" fill="#FAFAF8" stroke="#DDDCD8"/><circle cx="106" cy="669" r="37" fill="#E5F1EE"/><text x="106" y="685" text-anchor="middle" font-family="Arial" font-size="46" fill="#0D6B5B">✓</text><text x="203" y="637" class="t" font-size="27" font-weight="700">FATK (ModTriple)</text><text x="203" y="686" class="t" font-size="23">KRR</text><text x="373" y="686" class="t" font-size="23">SVM</text><text x="203" y="729" class="t" font-size="39">92.1%</text><text x="373" y="7